name: garak-fruit-brief (ci)

on:
  push:
    paths: ['*.py', 'tests/**', 'requirements.txt', '.github/workflows/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python -m py_compile send_brief.py kakao_client.py
      - run: python -m unittest discover -s tests -p "test_*.py" -v
